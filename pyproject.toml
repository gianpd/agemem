[project]
name = "agemem"
version = "0.1.0"
description = "AgeMem Interactive Chat — REPL entry point for the AgeMem-hybrid system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.0.0",
    "gliner>=0.2.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
agemem = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
