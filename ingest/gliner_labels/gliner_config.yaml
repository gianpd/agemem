# GLiNER Label Configuration File
# =================================
#
# This file defines custom label sets for Named Entity Recognition (NER)
# using the GLiNER model. Each label set specifies:
#   - labels: List of entity labels to extract
#   - label_map: Mapping from GLiNER labels to output bucket names
#   - buckets: Empty buckets for organizing extracted entities
#
# Usage in ingest.py:
#   python ingest.py doc.pdf --labels gliner_config.yaml:edilizia
#
# Or use built-in label sets without a config file:
#   python ingest.py doc.pdf --labels edilizia
#   python ingest.py doc.pdf --labels research
#   python ingest.py doc.pdf --labels legal

# ═══════════════════════════════════════════════════════════════
# Built-in: Edilizia (Italian Construction & Public Tenders)
# ═══════════════════════════════════════════════════════════════
edilizia:
  description: "Italian construction and public tenders (CIG, CUP, appalti)"
  labels:
    # Base entities
    - person
    - organization
    - date
    - financial value
    - location
    - articles
    # Gara e Appalto
    - tender code
    - tender type
    - contract type
    - award criterion
    # Soggetti e Ruoli
    - public administration
    - professional role
    - professional title
    - contractor
    # Opere e Interventi
    - work type
    - building type
    - construction material
    - construction phase
    # Tecnico-Normativo
    - technical standard
    - law or regulation
    - safety standard
    - permit type
    - classification code
    # Finanziario
    - budget category
    - funding source
    - guarantee
    # Temporal
    - deadline
    - duration
  label_map:
    # Base
    person: people
    organization: orgs
    date: dates
    financial value: values
    location: locations
    articles: articles
    # Gara
    tender code: codes
    tender type: gara
    contract type: gara
    award criterion: gara
    # Soggetti
    public administration: orgs
    professional role: roles
    professional title: roles
    contractor: orgs
    # Opere
    work type: opere
    building type: opere
    construction material: materiali
    construction phase: fasi
    # Normativo
    technical standard: norme
    law or regulation: norme
    safety standard: norme
    permit type: autorizzazioni
    classification code: codes
    # Finanziario
    budget category: valori
    funding source: finanziamenti
    guarantee: garanzie
    # Temporal
    deadline: scadenze
    duration: durate
  buckets:
    - people
    - orgs
    - dates
    - values
    - locations
    - articles
    - codes
    - gara
    - roles
    - opere
    - materiali
    - fasi
    - norme
    - autorizzazioni
    - finanziamenti
    - garanzie
    - scadenze
    - durate

